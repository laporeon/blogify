# Server configuration
server:
  port: ${PORT:8080}

# General Spring configuration
spring:
  application:
    name: blogify
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Database configuration
  mongodb:
    auto-index-creation: true
    authentication-database: admin

# Swagger configuration
springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

# ====== LOGGING CONFIGURATION ===
logging:
  level:
    com:
      laporeon: INFO
    org:
      mongodb:
        driver: INFO
      springframework:
        data:
          mongodb:
            core: DEBUG

# ====== ACTUATOR CONFIGURATION ===
management:
  endpoints:
    web:
      exposure:
        include: health