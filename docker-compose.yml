name: blogify

services:
  mongodb:
    container_name: blogify-api-database
    image: mongo:8.0.17-noble
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-dbpassword}
    volumes:
      - mongodb_data:/data/db
    networks:
      - blogify-api-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.runCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    build: .
    container_name: blogify-api
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: ${PORT:-8080}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-dbpassword}
      MONGO_DATABASE: ${MONGO_DATABASE:-blogifydb}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - blogify-api-network

volumes:
  mongodb_data:
    driver: local

networks:
  blogify-api-network:
    name: blogify-api-network
    driver: bridge